<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PractiCore AI — Personalized AI learning through everyday work tasks. Interactive prototype for POLInnoVENTURE 2026.">
<title>PractiCore AI — Your work, enhanced</title>
<style>
  :root {
    --ink: #172c2a;
    --ink-soft: #384b40;
    --muted: #68756e;
    --green: #126b56;
    --green-hover: #0d5645;
    --green-soft: #e5f0e8;
    --mint: #dcf2e7;
    --lime: #d6ef93;
    --paper: #f5f7f3;
    --surface: #fcfdfb;
    --white: #ffffff;
    --line: #e0e6df;
    --line-strong: #cdd7cc;
    --warn: #a86643;
    --warn-bg: #fbf3ee;
    --radius: 18px;
    --shadow-sm: 0 2px 10px rgba(23, 44, 42, 0.03);
    --shadow-lg: 0 24px 64px rgba(16, 39, 25, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; }
  button, a, input, select, textarea { outline-color: var(--green); }
  button { cursor: pointer; border: 0; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  a { color: var(--green); }

  svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 1.65;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .shell {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(21, 53, 44, 0.42);
    backdrop-filter: blur(2px);
    z-index: 25;
  }
  .sidebar-backdrop.open { display: block; }

  .sidebar {
    width: 244px;
    position: fixed;
    inset: 0 auto 0 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 30px 20px 20px;
    display: flex;
    flex-direction: column;
    z-index: 30;
  }

  .brand {
    font-size: 24px;
    letter-spacing: -1.1px;
    font-weight: 750;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 0 8px;
    background: none;
    color: var(--ink);
    text-align: left;
  }

  .brand-mark {
    background: var(--green);
    color: var(--lime);
    width: 34px;
    height: 38px;
    border-radius: 11px 11px 11px 3px;
    display: grid;
    place-items: center;
    font-size: 24px;
    font-weight: 800;
  }

  .brand small {
    font-size: 11px;
    margin: 8px 0 0 -4px;
    color: var(--green);
    font-weight: 700;
  }

  .workspace-label {
    font-size: 10px;
    letter-spacing: 1.9px;
    color: #8a948e;
    font-weight: 700;
    margin: 38px 12px 14px;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .nav button {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 12px 14px;
    border-radius: 11px;
    color: #5e6d64;
    background: none;
    font-size: 14px;
    font-weight: 550;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav button:hover { background: #eef3ed; color: var(--ink); }
  .nav button.active { background: var(--green-soft); color: #125d49; font-weight: 600; }

  .side-bottom {
    margin-top: auto;
    padding-top: 28px;
  }

  .demo-help {
    background: #edf4e7;
    border: 1px solid #e1ead9;
    padding: 15px;
    border-radius: 13px;
    font-size: 12px;
    color: #58685a;
    line-height: 1.45;
  }

  .demo-help strong {
    display: block;
    color: #2f4830;
    margin-bottom: 4px;
  }

  .text-button {
    background: none;
    padding: 0;
    color: var(--green);
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  .profile {
    margin-top: 20px;
    padding: 16px 8px 0;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 12px;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #e9e5dc;
    color: var(--ink);
    display: grid;
    place-items: center;
    font-weight: 650;
    flex-shrink: 0;
  }

  .profile strong { display: block; font-size: 12px; }
  .profile span { color: var(--muted); font-size: 11px; }

  /* Main layout */
  .main {
    margin-left: 244px;
    width: calc(100% - 244px);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .topbar {
    height: 82px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 44px;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .top-info {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .mobile-menu {
    display: none;
    background: none;
    padding: 6px;
    border-radius: 8px;
    color: var(--ink);
  }
  .mobile-menu:hover { background: #eef3ed; }

  .crumb {
    font-size: 12px;
    color: #8a948e;
  }
  .crumb b {
    font-weight: 600;
    color: var(--ink-soft);
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .demo-tag {
    font-size: 10px;
    letter-spacing: 1.3px;
    color: #606d57;
    border: 1px solid #d9e2d2;
    background: #f8faf6;
    padding: 5px 10px;
    border-radius: 6px;
    font-weight: 600;
  }

  .quiet-btn {
    display: flex;
    gap: 7px;
    align-items: center;
    background: #f2f6ef;
    border: 1px solid #e0e8dc;
    color: #3d5244;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 13px;
    border-radius: 9px;
    transition: background 0.15s ease;
  }
  .quiet-btn:hover { background: #e6efe2; }
  .quiet-btn.active { background: var(--green-soft); color: var(--green); border-color: #c2dacb; }
  .quiet-btn svg { width: 16px; height: 16px; }

  .content {
    max-width: 1320px;
    width: 100%;
    margin: 0 auto;
    padding: 38px 44px 55px;
    flex: 1;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 750;
    margin: 0 0 10px;
  }

  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 35px; letter-spacing: -1.4px; line-height: 1.18; font-weight: 680; }
  h2 { font-size: 20px; letter-spacing: -0.6px; font-weight: 650; }
  h3 { font-size: 15px; font-weight: 650; }

  .subtitle {
    color: var(--muted);
    margin-top: 10px;
    font-size: 14px;
    max-width: 700px;
  }

  .heading-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 26px;
  }

  /* Step bar */
  .path-steps {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--line);
    margin: 26px 0 30px;
    overflow-x: auto;
  }

  .path-step {
    padding: 0 22px 15px 0;
    margin-right: 26px;
    color: #849086;
    font-size: 12px;
    font-weight: 550;
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s ease;
  }

  .path-step:hover { color: var(--ink); }

  .path-step span {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 1px solid #cfd8ce;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 650;
  }

  .path-step.active {
    color: var(--green);
    border-bottom-color: var(--green);
    font-weight: 650;
  }

  .path-step.active span {
    background: var(--green);
    border-color: var(--green);
    color: var(--white);
  }

  /* Grid & Panels */
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1.75fr) minmax(275px, 1fr);
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow-sm);
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .small-label { font-size: 11px; color: var(--muted); }
  .section-title { font-size: 13px; font-weight: 650; display: block; margin: 24px 0 10px; }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  label.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 11px;
    font-weight: 650;
    color: #5b6860;
  }

  input, select, textarea {
    color: var(--ink);
    border: 1px solid #d7dfd6;
    border-radius: 9px;
    background: var(--surface);
    padding: 11px 12px;
    font-size: 13px;
    width: 100%;
    transition: border-color 0.15s ease;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--green);
    background: var(--white);
  }

  input[type="range"] {
    padding: 0;
    accent-color: var(--green);
    cursor: pointer;
    background: transparent;
    border: 0;
  }

  select { padding-right: 26px; }
  textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

  .task-row {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #eef1eb;
    cursor: pointer;
  }
  .task-row:last-child { border-bottom: 0; }
  .task-row input { width: 17px; height: 17px; accent-color: var(--green); flex-shrink: 0; cursor: pointer; }
  .task-copy { flex: 1; font-size: 13px; font-weight: 500; }
  .task-copy small { display: block; color: #838e83; margin-top: 2px; font-size: 11px; font-weight: 400; }

  .tag {
    font-size: 10px;
    letter-spacing: 0.3px;
    border-radius: 6px;
    padding: 4px 8px;
    background: #eef4eb;
    color: #557250;
    font-weight: 600;
    white-space: nowrap;
  }

  .btn {
    border-radius: 9px;
    padding: 11px 18px;
    background: var(--green);
    color: var(--white);
    font-size: 12px;
    font-weight: 650;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    min-height: 42px;
    text-decoration: none;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .btn:hover { background: var(--green-hover); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 15px; height: 15px; }
  .btn.light { background: #eaf3e8; color: var(--green); }
  .btn.light:hover { background: #dcebd9; }
  .btn.line { background: var(--white); border: 1px solid #d5dfd4; color: var(--green); }
  .btn.line:hover { background: #f6faf5; }
  .btn.small { padding: 8px 13px; min-height: 36px; font-size: 11px; }

  .form-footer {
    border-top: 1px solid var(--line);
    padding-top: 20px;
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
  }

  .fine { font-size: 11px; color: #7e897b; max-width: 260px; }

  /* Feature / Aside cards */
  .feature {
    background: #e1efdc;
    border: 1px solid #d2e4cc;
    position: relative;
    overflow: hidden;
    padding: 28px;
    box-shadow: none;
  }
  .feature h2 { font-size: 24px; line-height: 1.24; letter-spacing: -0.9px; }
  .feature p { font-size: 12px; color: #546a4f; margin-top: 12px; line-height: 1.6; }

  .plant { height: 96px; margin-top: 12px; position: relative; }
  .leaf {
    position: absolute;
    width: 65px;
    height: 28px;
    border-radius: 100% 0 100% 0;
    background: #a7c99b;
    transform: rotate(15deg);
    left: 27px;
    top: 28px;
  }
  .leaf.two { left: 88px; top: 22px; transform: rotate(-70deg); background: #7fa375; }
  .leaf.three { left: 75px; top: 49px; transform: rotate(-25deg); background: #bed2a6; }
  .stem {
    position: absolute;
    left: 88px;
    top: 41px;
    height: 54px;
    width: 2px;
    background: #608358;
    transform: rotate(-18deg);
  }
  .feature .feature-caption { font-size: 10px; margin-top: 0; opacity: 0.85; font-weight: 600; }

  .compact { margin-top: 20px; }
  .checks { padding: 0; margin: 14px 0 0; list-style: none; }
  .checks li { font-size: 12px; display: flex; gap: 9px; margin: 11px 0; color: #5f7062; line-height: 1.45; }
  .check { color: var(--green); font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .note { font-size: 11px; color: #838e81; margin-top: 18px; }

  /* Lessons */
  .progress { height: 7px; background: #edf2e7; border-radius: 99px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width 0.3s ease; }
  .saving-note { font-size: 11px; color: #798874; margin: 10px 0 6px; font-weight: 500; }

  .lesson {
    padding: 20px 0;
    display: flex;
    gap: 18px;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .lesson:last-of-type { border-bottom: 0; }
  .lesson-num { font-size: 24px; color: #b7c6b6; font-weight: 400; min-width: 34px; }
  .lesson-main { flex: 1; }
  .lesson-main p { font-size: 12px; color: #718070; margin: 5px 0 10px; max-width: 480px; }
  .lesson-meta { display: flex; gap: 14px; align-items: center; font-size: 11px; color: #7b8b76; }
  .lesson-complete { color: var(--green); font-weight: 650; }

  .lesson-read { font-size: 14px; color: #475d45; line-height: 1.85; }
  .lesson-read h3 { margin-top: 22px; color: var(--ink); font-size: 16px; }
  .lesson-read p { margin-top: 9px; }
  .lesson-read pre {
    white-space: pre-wrap;
    background: #f3f7ef;
    border: 1px solid #e1eadb;
    padding: 16px;
    font: 12px/1.75 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ink);
    border-radius: 10px;
    margin-top: 10px;
  }

  .page-back {
    background: none;
    color: var(--green);
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    gap: 7px;
    align-items: center;
    margin-bottom: 18px;
    padding: 0;
  }
  .page-back:hover { text-decoration: underline; text-underline-offset: 4px; }

  /* Practice Lab */
  .scenario {
    background: #f2f6ee;
    border: 1px solid #e3ecdd;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .scenario-label { font-size: 10px; letter-spacing: 1.2px; color: #75866f; font-weight: 700; margin-bottom: 8px; }
  .scenario p { font-size: 13px; color: #3c4f3b; line-height: 1.6; }
  .scenario small { display: block; margin-top: 12px; color: #6c7d66; font-size: 11px; background: rgba(255,255,255,0.65); padding: 9px 12px; border-radius: 8px; }

  .rubric {
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .rubric-item {
    display: flex;
    gap: 11px;
    padding: 11px 0;
    border-bottom: 1px solid #eef2ea;
    font-size: 12px;
  }
  .rubric-item:last-child { border-bottom: 0; }
  .rubric-icon { font-size: 15px; min-width: 18px; color: var(--green); font-weight: 750; }
  .rubric-icon.miss { color: #99a598; }
  .rubric-item strong { display: block; font-weight: 650; font-size: 12px; color: var(--ink); }
  .rubric-item p { font-size: 11px; color: #73836e; margin-top: 2px; }

  .sample-output {
    font-size: 12px;
    background: #f5f8f1;
    border-left: 3px solid var(--green);
    padding: 16px;
    white-space: pre-wrap;
    margin-top: 12px;
    border-radius: 0 10px 10px 0;
    color: var(--ink);
    line-height: 1.65;
  }

  /* Impact */
  .metric {
    font-size: 46px;
    letter-spacing: -2px;
    font-weight: 600;
    color: var(--green);
    line-height: 1.05;
    margin-top: 6px;
  }
  .metric.negative { color: var(--warn); }
  .metric small { font-size: 16px; letter-spacing: 0; font-weight: 500; }

  .calculation {
    padding: 18px 0;
    margin: 18px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: #5c6e59;
  }

  .quality {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 12px;
    color: #586a55;
    margin: 18px 0;
    cursor: pointer;
  }
  .quality input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--green); flex-shrink: 0; }

  /* Employer & Business Model */
  .inline-note {
    font-size: 12px;
    background: #eef4e8;
    border: 1px solid #dfe9d7;
    padding: 13px 16px;
    border-radius: 10px;
    color: #556852;
    margin-bottom: 24px;
  }

  .summary-strip { display: flex; gap: 32px; flex-wrap: wrap; margin: 20px 0 24px; }
  .summary-strip > div { min-width: 140px; }
  .summary-strip strong { font-size: 30px; letter-spacing: -1px; display: block; font-weight: 650; color: var(--ink); }
  .summary-strip strong small { font-size: 15px; color: var(--muted); font-weight: 500; }
  .summary-strip small { font-size: 11px; color: #788773; }

  .team-table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 12px; }
  .team-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 650;
    color: #778772;
    padding: 12px;
    border-bottom: 1px solid var(--line);
  }
  .team-table td { padding: 15px 12px; border-bottom: 1px solid #edf1e7; }
  .team-table tr:last-child td { border-bottom: 0; }

  .bar-chart { display: grid; gap: 18px; margin: 22px 0; }
  .bar-row {
    display: grid;
    grid-template-columns: 95px 1fr 42px;
    gap: 12px;
    align-items: center;
    font-size: 12px;
    color: #5c6e59;
    font-weight: 500;
  }
  .bar { height: 12px; background: #ecf2e6; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }

  .money {
    font-size: 50px;
    color: var(--green);
    line-height: 1;
    margin: 16px 0 6px;
    letter-spacing: -2px;
    font-weight: 650;
  }
  .money span { font-size: 14px; letter-spacing: 0; color: #6e8068; font-weight: 500; }

  .estimator-box {
    margin-top: 22px;
    padding: 18px 20px;
    background: #f5f9f2;
    border: 1px solid #dfe9da;
    border-radius: 13px;
  }
  .estimator-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .estimator-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #dfe9da;
  }
  .estimator-stat strong { display: block; font-size: 20px; color: var(--green); letter-spacing: -0.6px; }
  .estimator-stat span { font-size: 11px; color: var(--muted); }

  /* Empty state, Pills, Badges, Modal, Toast */
  .empty { padding: 48px 24px; text-align: center; color: #5b6f56; }
  .pill { background: #eff4eb; font-size: 11px; padding: 4px 9px; border-radius: 6px; color: #587053; font-weight: 600; }
  .wide-note { font-size: 11px; color: #74846f; margin-top: 16px; line-height: 1.65; }
  .cta-row { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .badge-row { display: flex; gap: 8px; align-items: center; }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(16, 39, 25, 0.48);
    display: grid;
    place-items: center;
    z-index: 50;
    padding: 20px;
    backdrop-filter: blur(3px);
  }
  .modal {
    background: var(--white);
    padding: 32px;
    border-radius: 19px;
    width: min(600px, 100%);
    max-height: 90vh;
    overflow: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal h2 { font-size: 24px; }
  .modal p { font-size: 13px; color: #5c6d59; margin-top: 14px; line-height: 1.65; }
  .modal ul { font-size: 12px; color: #5c6d59; padding-left: 19px; margin-top: 12px; }

  @media (max-width: 1120px) {

    .topbar { padding: 0 26px; }
    .content { padding: 30px 26px; }
    .grid { grid-template-columns: minmax(0, 1.55fr) minmax(240px, 1fr); gap: 18px; }

  @media (max-width: 840px) {
    .sidebar { display: none; }
    .sidebar.open { display: flex; }
    .main { margin-left: 0; width: 100%; }
    .topbar { height: 70px; }
    .mobile-menu { display: block; }
    .content { padding: 24px 20px 36px; }

  @media (max-width: 540px) {

    .subtitle { font-size: 13px; }

</style>

</div>

<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const STORAGE_KEY = 'practicore-ai-demo-2026';

const icons = {

  learn: '<path d="M3 5c3-1 6 0 9 2 3-2 6-3 9-2v15c-3-1-6 0-9 2-3-2-6-3-9-2V5Z"/><path d="M12 7v15"/>',
  practice: '<path d="m9 3 6 0M10 3v7l-6 9c-.7 1 0 2 1 2h14c1 0 1.7-1 1-2l-6-9V3M7 16h10"/>',
  impact: '<path d="M4 20V12m8 8V4m8 16v-9M2 22h20"/>',
  arrow: '<path d="M4 12h16m-6-6 6 6-6 6"/>',
  team: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3a4 4 0 0 1 0 8"/><circle cx="9" cy="7" r="4"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  back: '<path d="M20 12H4m6-6-6 6 6 6"/>',
  download: '<path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/>',
  shield: '<path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z"/><path d="m8 12 3 3 5-6"/>'
};

const ic = name => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (icons[name] || '') + '</svg>';

const esc = str => String(str).replace(/[&<>"']/g, ch => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
}[ch]));

const roleData = {
  sales: {
    name: 'Sales & account management',

    tasks: [
      ['Draft follow-up emails', 'After client meetings · 4 times / week', 'Writing'],

    ],
    scenario: 'You have finished a discovery call with a prospective client. They want a clear summary and next steps. Draft a follow-up using only the approved notes.',
    notes: 'Sample notes: Client needs a stock visibility dashboard. A demo is available next Tuesday. Pricing and delivery dates are not confirmed. The next step is to agree on a demo time.',
    prompt: 'Act as a sales assistant. Using only these sanitized notes, draft a concise follow-up email for the client. Do not invent prices or delivery dates. Mark missing details as [TO CONFIRM]. Use a short summary and one clear next step. I will verify all details before sending.',
    output: [

      '',
      'Best regards,',
      '[Your name]'
    ].join('\n'),
    module: 'Clear client follow-ups',
    outcome: 'A reusable follow-up workflow with an accuracy check.',
    baseline: 30,
    after: 20,
    freq: 4
  },
  marketing: {
    name: 'Marketing & communications',
    short: 'Marketing',
    tasks: [
      ['Write a campaign brief', 'At the start of each campaign · 2 times / week', 'Planning'],
      ['Adapt a post for different channels', 'For approved campaigns · 5 times / week', 'Writing'],
      ['Summarize weekly campaign results', 'From verified reports · 1 time / week', 'Analysis']
    ],
    scenario: 'A furniture studio wants a campaign brief for a new showroom collection. Turn the approved sample facts into a concise brief without inventing discounts or product claims.',
    notes: 'Sample facts: New oak desk collection. Audience: people furnishing a home office. Main channel: Instagram. Objective: showroom appointments. No discount or performance claims approved.',
    prompt: 'Act as a marketing assistant. Using only the approved sample facts, draft a campaign brief for Instagram aimed at people furnishing a home office. Include the audience, objective, message and call to action. Do not invent discounts or product claims. Mark unknown details as [TO CONFIRM]. I will verify the brief before approval.',
    output: [
      'Campaign brief: Oak desks for the home office',
      '',
      'Audience: People furnishing a home office.',
      'Objective: Encourage showroom appointments.',
      'Message: Explore the new oak desk collection in person.',
      'Channel: Instagram.',
      'Call to action: Book a showroom visit.',
      'To confirm: Launch date, images and booking link.'
    ].join('\n'),
    module: 'Useful campaign briefs',
    outcome: 'A campaign brief workflow that preserves approved facts.',
    baseline: 45,
    after: 30,
    freq: 2
  },
  operations: {
    name: 'Administration & operations',
    short: 'Operations',
    tasks: [
      ['Summarize a weekly operations update', 'From approved notes · 1 time / week', 'Writing'],
      ['Turn a procedure into a checklist', 'For recurring processes · 2 times / week', 'Planning'],
      ['Structure meeting action items', 'After internal meetings · 3 times / week', 'Organization']
    ],
    scenario: 'An operations team needs a checklist for preparing a customer order. Convert the approved procedure into clear steps and flag missing information.',
    notes: 'Sample procedure: Confirm product reference and quantity. Check stock. Obtain internal approval for delivery. Send the confirmed order summary. Delivery date must be checked by the order coordinator.',
    prompt: 'Act as an operations assistant. Using only this sanitized procedure, draft an order-preparation checklist. Include an owner for each step where provided. Do not invent stock levels or delivery dates. Mark missing details as [TO CONFIRM]. The coordinator must verify the checklist before use.',
    output: [
      'Order preparation checklist',
      '',
      '1. Confirm product reference and quantity. Owner: [TO CONFIRM].',
      '2. Check stock against the approved system. Owner: [TO CONFIRM].',
      '3. Obtain internal delivery approval.',
      '4. Ask the order coordinator to verify the delivery date.',
      '5. Send the verified order summary.',
      '',
      'Review all missing details before release.'
    ].join('\n'),
    module: 'Reliable operational checklists',
    outcome: 'A reusable checklist with a clear human review step.',
    baseline: 35,
    after: 25,
    freq: 2
  }
};

const VALID_LEVELS = ['Beginner', 'Occasional user', 'Regular user'];
const VALID_TOOLS = [
  'Company-approved AI assistant',
  'Microsoft Copilot',
  'ChatGPT Business',
  'Google Gemini for Workspace'
];

const defaults = {
  role: 'sales',
  level: 'Beginner',
  tool: 'Company-approved AI assistant',
  tasks: null,
  custom: '',
  path: false,
  completed: [],
  practice: false,
  saved: false,
  before: 30,
  after: 20,
  freq: 4,
  quality: false,
  prompt: '',
  seats: 25
};

function clampInt(val, min, max, fallback) {
  const num = Number(val);
  if (!Number.isFinite(num)) return fallback;
  return Math.max(min, Math.min(max, Math.round(num)));
}

function loadState() {
  try {
    const rawStr = localStorage.getItem(STORAGE_KEY);
    if (!rawStr) return { ...defaults };
    const parsed = JSON.parse(rawStr);
    if (!parsed || typeof parsed !== 'object') return { ...defaults };

    const next = { ...defaults, ...parsed };
    if (!roleData[next.role]) next.role = defaults.role;
    if (!VALID_LEVELS.includes(next.level)) next.level = defaults.level;
    if (!VALID_TOOLS.includes(next.tool)) next.tool = defaults.tool;

    if (next.tasks !== null) {
      if (Array.isArray(next.tasks)) {
        const validRoleTasks = roleData[next.role].tasks.map(t => t[0]);
        next.tasks = next.tasks.filter(t => typeof t === 'string' && validRoleTasks.includes(t));
      } else {
        next.tasks = null;
      }
    }

    next.custom = typeof next.custom === 'string' ? next.custom.slice(0, 120) : '';
    next.path = Boolean(next.path);

    if (Array.isArray(next.completed)) {
      next.completed = [...new Set(next.completed.filter(i => i === 0 || i === 1 || i === 2))];
    } else {
      next.completed = [];
    }

    next.practice = Boolean(next.practice);
    next.saved = Boolean(next.saved);
    next.before = clampInt(next.before, 0, 600, roleData[next.role].baseline);
    next.after = clampInt(next.after, 0, 600, roleData[next.role].after);
    next.freq = clampInt(next.freq, 0, 100, roleData[next.role].freq);
    next.quality = Boolean(next.quality);
    next.prompt = typeof next.prompt === 'string' ? next.prompt.slice(0, 3500) : '';
    next.seats = clampInt(next.seats, 10, 40, 25);

    return next;
  } catch (err) {
    return { ...defaults };
  }
}

let state = loadState();
let page = 'work';
let currentLesson = 0;

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    // Ignore storage quota or private mode restrictions
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.className = 'toast';
  el.textContent = msg;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    el.className = '';
    el.textContent = '';
  }, 3200);
}

function taskList() {
  return state.tasks !== null ? state.tasks : roleData[state.role].tasks.map(t => t[0]);
}

function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  const btn = document.getElementById('menu-btn');
  if (sb) sb.classList.remove('open');
  if (bd) bd.classList.remove('open');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

function nav(targetPage) {
  page = targetPage;
  closeSidebar();
  render();
  window.scrollTo(0, 0);
}

const STEP_PAGES = ['work', 'learn', 'practice', 'impact'];
const STEP_LABELS = ['Map your work', 'Learn', 'Practice', 'Apply'];

function stepBar(activeIndex) {
  return '<div class="path-steps">' + STEP_LABELS.map((label, idx) =>
    '<button type="button" class="path-step ' + (idx === activeIndex ? 'active' : '') + '" data-nav="' + STEP_PAGES[idx] + '">' +
      '<span>' + (idx + 1) + '</span>' + label +
    '</button>'
  ).join('') + '</div>';
}

function heading(eyebrow, title, subtitle, actionHtml = '') {
  return '<div class="heading-row">' +
    '<div>' +
      '<p class="eyebrow">' + eyebrow + '</p>' +
      '<h1>' + title + '</h1>' +
      '<p class="subtitle">' + subtitle + '</p>' +
    '</div>' +
    actionHtml +
  '</div>';
}

function footer() {
  return '<footer class="footer">' +
    '<span>PractiCore AI · POLInnoVENTURE 2026</span>' +
    '<span>Student concept prototype · Sample data · No live AI connection</span>' +
  '</footer>';
}

function render() {
  document.querySelectorAll('[data-page]').forEach(btn => {
    const p = btn.dataset.page;
    const isActive = (p === page) || (p === 'learn' && page === 'lesson');
    btn.classList.toggle('active', isActive);
    const labelMap = {
      work: 'My work',
      learn: 'Learning path',
      practice: 'Practice lab',
      impact: 'My impact'
    };
    btn.innerHTML = ic(p) + labelMap[p];
  });

  const crumbMap = {
    work: 'My work',
    learn: 'Learning path',
    practice: 'Practice lab',
    impact: 'My impact',
    team: 'Team overview',
    plan: 'Proposed business model',
    lesson: 'Learning path · Lesson 0' + (currentLesson + 1)
  };
  document.getElementById('crumb').textContent = crumbMap[page] || 'My work';

  const teamBtn = document.getElementById('team-btn');
  teamBtn.innerHTML = ic('team') + '<span>Team overview</span>';
  teamBtn.classList.toggle('active', page === 'team' || page === 'plan');

  document.getElementById('menu-btn').innerHTML = ic('menu');

  const viewMap = {
    work: workView,
    learn: learnView,
    practice: practiceView,
    impact: impactView,
    team: teamView,
    plan: planView,
    lesson: lessonView
  };

  const renderFn = viewMap[page] || workView;
  document.getElementById('content').innerHTML = renderFn() + footer();
  bindPage();
}

function workView() {
  const r = roleData[state.role];
  const checkedTasks = taskList();

  return heading(
    'LEARNING THAT STARTS WITH YOU',
    'Your work, with a new advantage.',
    'Tell us what your work looks like. We’ll turn everyday tasks into a practical AI learning path.'
  ) + stepBar(0) +
  '<div class="grid">' +
    '<section class="panel">' +
      '<div class="panel-head"><h2>Let’s map your work</h2><span class="small-label">About 3 minutes</span></div>' +
      '<div class="fields">' +
        '<label class="field">Your role' +
          '<select id="role-select">' +
            Object.entries(roleData).map(([k, v]) =>
              '<option value="' + k + '" ' + (k === state.role ? 'selected' : '') + '>' + esc(v.name) + '</option>'
            ).join('') +
          '</select>' +
        '</label>' +
        '<label class="field">Your experience with AI' +
          '<select id="level-select">' +
            VALID_LEVELS.map(lvl =>
              '<option value="' + esc(lvl) + '" ' + (lvl === state.level ? 'selected' : '') + '>' + esc(lvl) + '</option>'
            ).join('') +
          '</select>' +
        '</label>' +
      '</div>' +
      '<label class="field" style="margin-top:16px">Your approved tool' +
        '<select id="tool-select">' +
          VALID_TOOLS.map(tl =>
            '<option value="' + esc(tl) + '" ' + (tl === state.tool ? 'selected' : '') + '>' + esc(tl) + '</option>'
          ).join('') +
        '</select>' +
      '</label>' +
      '<span class="section-title">What takes up your week?</span>' +
      '<p class="small-label" style="margin-top:-4px;margin-bottom:8px">Select recurring tasks you’d like to approach differently.</p>' +
      '<div id="task-options">' +
        r.tasks.map(t =>
          '<label class="task-row">' +
            '<input type="checkbox" name="task" value="' + esc(t[0]) + '" ' + (checkedTasks.includes(t[0]) ? 'checked' : '') + '>' +

            '<span class="tag">' + esc(t[2]) + '</span>' +
          '</label>'
        ).join('') +
      '</div>' +
      '<label class="field" style="margin-top:16px">Another task you would like to improve (optional)' +
        '<input id="custom-task" type="text" maxlength="120" placeholder="For example, prepare a weekly client update" value="' + esc(state.custom) + '">' +
      '</label>' +
      '<div class="form-footer">' +
        '<p class="fine">Use sample tasks. Keep client details and confidential information out of the demo.</p>' +
        '<button type="button" class="btn" id="build-path">Build my learning path ' + ic('arrow') + '</button>' +
      '</div>' +
    '</section>' +
    '<aside class="aside-grid">' +
      '<section class="panel feature">' +
        '<p class="eyebrow" style="color:#4c6e44">A LITTLE PRACTICE. A USEFUL CHANGE.</p>' +
        '<h2>Your next AI skill is already on your to-do list.</h2>' +
        '<p>Learn through familiar tasks, practice with sample situations, and take a reviewed workflow back to work.</p>' +
        '<div class="plant" aria-hidden="true"><i class="stem"></i><i class="leaf"></i><i class="leaf two"></i><i class="leaf three"></i></div>' +
        '<p class="feature-caption">Built around your role. Guided by human judgment.</p>' +
      '</section>' +
      '<section class="panel compact">' +
        '<div class="badge-row">' + ic('shield') + '<h3>You stay in control</h3></div>' +
        '<ul class="checks">' +
          '<li><span class="check">✓</span>Work with approved tools and sample data</li>' +
          '<li><span class="check">✓</span>Review AI outputs before using them</li>' +
          '<li><span class="check">✓</span>Track learning without employee rankings</li>' +
        '</ul>' +
        '<p class="note">This demo stores progress locally in your browser.</p>' +
      '</section>' +
    '</aside>' +
  '</div>';
}

function getModules() {
  const r = roleData[state.role];
  return [
    {
      title: 'AI foundations for your work',
      desc: state.level === 'Beginner'
        ? 'Understand suitable tasks, model limitations and the role of human review.'
        : 'Review the boundaries of your approved AI tool and identify where it helps.',
      minutes: 7
    },
    {
      title: r.module,
      desc: 'Build a clear prompt using context, approved facts and an output format.',
      minutes: 10
    },
    {
      title: 'Quality and a workflow you can reuse',
      desc: 'Check the output, record full review time and save the steps that work.',
      minutes: 8
    }
  ];
}

function emptyPath(stepIdx) {
  return heading(
    'YOUR NEXT STEP',
    'A path built around your tasks.',
    'Map your work first so the learning path, practice lab and impact estimate reflect your role.'
  ) + stepBar(stepIdx) +
  '<section class="panel empty">' +
    '<h2>Start with your everyday work</h2>' +
    '<p style="margin:12px auto 22px;font-size:13px;max-width:440px">Choose a role and select at least one task you want to improve to unlock your tailored workspace.</p>' +
    '<button type="button" class="btn" data-nav="work">Map my work ' + ic('arrow') + '</button>' +
  '</section>';
}

function learnView() {
  if (!state.path) return emptyPath(1);
  const r = roleData[state.role];
  const selectedTasks = taskList();
  const pct = Math.round((state.completed.length / 3) * 100);

  return heading(
    'YOUR PERSONAL LEARNING PATH',
    'Useful AI skills. Familiar work.',
    'A short path for ' + r.name.toLowerCase() + ', adapted to your starting experience.'
  ) + stepBar(1) +
  '<div class="grid">' +
    '<section class="panel">' +
      '<div class="panel-head"><h2>Your first learning path</h2><span class="pill">' + esc(state.level) + '</span></div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<p class="saving-note">' + state.completed.length + ' of 3 lessons complete</p>' +
      getModules().map((m, i) => {
        const done = state.completed.includes(i);
        return '<article class="lesson">' +
          '<div class="lesson-num">0' + (i + 1) + '</div>' +
          '<div class="lesson-main">' +
            '<h3>' + esc(m.title) + '</h3>' +
            '<p>' + esc(m.desc) + '</p>' +
            '<div class="lesson-meta">' +
              '<span>' + m.minutes + ' min</span>' +
              '<span class="' + (done ? 'lesson-complete' : '') + '">' + (done ? '✓ Complete' : 'Guided lesson') + '</span>' +
            '</div>' +
          '</div>' +
          '<button type="button" class="btn small ' + (done ? 'line' : 'light') + '" data-lesson="' + i + '">' + (done ? 'Review' : 'Open lesson') + '</button>' +
        '</article>';
      }).join('') +
      '<div class="cta-row"><button type="button" class="btn" data-nav="practice">Try a work scenario ' + ic('arrow') + '</button></div>' +
    '</section>' +
    '<aside class="aside-grid">' +
      '<section class="panel feature">' +
        '<p class="eyebrow">YOUR PRACTICAL OUTCOME</p>' +
        '<h2>' + esc(r.outcome) + '</h2>' +
        '<p>Use the sample workflow as a starting point. Your manager can approve it before you use it with real work.</p>' +
      '</section>' +
      '<section class="panel compact">' +
        '<h3>Based on your priorities</h3>' +
        '<ul class="checks">' +
          selectedTasks.map(t => '<li><span class="check">✓</span>' + esc(t) + '</li>').join('') +

function evaluatePromptRules(promptText) {
  const t = promptText.toLowerCase();
  return [
    [
      'Task and context',
      /draft|write|summari|checklist|brief|email|follow.up|convert|structure|prepare/.test(t),
      'Name the task and the audience or context.'
    ],
    [
      'Approved facts',
      /approved|saniti|sample|using only|these notes|facts|procedure/.test(t),
      'Point to approved input rather than asking for invented details.'
    ],
    [
      'Output format',
      /concise|short|checklist|format|include|bullet|summary|steps/.test(t),
      'Explain the shape of a useful answer.'
    ],
    [
      'Missing information',
      /missing|unknown|confirm|do not invent|don.t invent|flag/.test(t),
      'Ask the assistant to flag gaps.'
    ],
    [
      'Human review',
      /review|verify|check|approval|approve/.test(t),
      'Keep a human review before the output enters real work.'
    ]
  ];
}

function buildRubricHtml(promptText) {
  const rules = evaluatePromptRules(promptText);
  return '<div class="rubric"><h3>Prompt elements to review</h3>' +
    rules.map(([label, ok, help]) =>
      '<div class="rubric-item">' +
        '<span class="rubric-icon ' + (ok ? '' : 'miss') + '">' + (ok ? '✓' : '○') + '</span>' +
        '<div><strong>' + esc(label) + '</strong><p>' + esc(ok ? 'Element detected. Confirm that it fits your task.' : help) + '</p></div>' +
      '</div>'
    ).join('') +
  '</div>';
}

function updateImpact() {
  const metricEl = document.getElementById('weekly-metric');
  const descEl = document.getElementById('weekly-description');
  const calcEl = document.getElementById('calculation');
  if (!metricEl || !descEl || !calcEl) return;

  const before = Number(state.before);
  const after = Number(state.after);
  const freq = Number(state.freq);
  const minutes = (before - after) * freq;
  const hours = (minutes / 60).toFixed(1);

  metricEl.classList.toggle('negative', minutes < 0);
  metricEl.innerHTML = hours + ' <small>hours / week</small>';
  descEl.textContent = minutes >= 0
    ? 'Potential capacity released for this sample task.'
    : 'The sample task takes longer with AI at these inputs.';
  calcEl.textContent =
    '(' + before + ' min − ' + after + ' min) × ' + freq + ' times / week = ' + minutes + ' minutes / week. Quality review: ' +
    (state.quality ? 'checked for the sample.' : 'still to confirm.');
}

    'Quality check: ' + (state.quality ? 'checked on sample' : 'not yet confirmed') + '.',
    '',
    'This is a student concept prototype with sample content, not a live AI assessment or measured customer result.'

  const textBlob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });

  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Sample workflow downloaded.');

function bindPage() {
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => nav(btn.dataset.nav);
  });

  document.querySelectorAll('[data-lesson]').forEach(btn => {
    btn.onclick = () => {
      currentLesson = Number(btn.dataset.lesson) || 0;
      nav('lesson');
    };
  });

  if (page === 'work') {
    const roleSelect = document.getElementById('role-select');
    const levelSelect = document.getElementById('level-select');
    const toolSelect = document.getElementById('tool-select');
    const customInput = document.getElementById('custom-task');
    const buildBtn = document.getElementById('build-path');

    roleSelect.onchange = e => {
      const nextRole = roleData[e.target.value] ? e.target.value : 'sales';
      state = {
        ...state,
        role: nextRole,
        tasks: null,
        path: false,
        completed: [],
        practice: false,
        saved: false,
        prompt: '',
        custom: '',
        quality: false,
        before: roleData[nextRole].baseline,
        after: roleData[nextRole].after,
        freq: roleData[nextRole].freq
      };
      save();
      render();
    };

    levelSelect.onchange = e => { state.level = e.target.value; save(); };
    toolSelect.onchange = e => { state.tool = e.target.value; save(); };
    customInput.oninput = e => { state.custom = e.target.value; save(); };

    document.querySelectorAll('[name="task"]').forEach(chk => {
      chk.onchange = () => {
        state.tasks = [...document.querySelectorAll('[name="task"]:checked')].map(c => c.value);
        save();
      };
    });

    buildBtn.onclick = () => {
      if (!taskList().length && !state.custom.trim()) {
        toast('Select at least one task or add a sample task.');
        return;
      }
      state.path = true;
      save();
      nav('learn');
    };
  }

  if (page === 'lesson') {
    const completeBtn = document.getElementById('complete-lesson');
    if (completeBtn) {
      completeBtn.onclick = () => {
        if (!state.completed.includes(currentLesson)) state.completed.push(currentLesson);
        save();
        toast('Lesson marked complete.');
        nav('learn');
      };
    }
    const nextBtn = document.getElementById('next-lesson');
    if (nextBtn) {
      nextBtn.onclick = () => {
        if (!state.completed.includes(currentLesson)) state.completed.push(currentLesson);
        save();
        currentLesson = Math.min(2, currentLesson + 1);
        render();
        window.scrollTo(0, 0);
      };
    }
  }

  if (page === 'practice') {
    const promptInput = document.getElementById('prompt-input');
    const exampleBtn = document.getElementById('use-example');
    const reviewBtn = document.getElementById('review-prompt');

    promptInput.oninput = e => {
      state.prompt = e.target.value;
      save();
    };

    exampleBtn.onclick = () => {
      state.prompt = roleData[state.role].prompt;
      save();
      promptInput.value = state.prompt;
      toast('Guided example added. Review it before continuing.');
    };

    reviewBtn.onclick = reviewPrompt;
    bindPracticeResult();
  }

  if (page === 'impact') {
    ['before', 'after', 'freq'].forEach(key => {
      const inp = document.getElementById(key + '-input');
      inp.oninput = e => {
        const maxVal = key === 'freq' ? 100 : 600;
        state[key] = clampInt(e.target.value, 0, maxVal, 0);
        save();
        updateImpact();
      };
    });

    const qualityChk = document.getElementById('quality-check');
    qualityChk.onchange = e => {
      state.quality = e.target.checked;
      save();
      updateImpact();
    };

    document.getElementById('export-workflow').onclick = exportWorkflow;
    updateImpact();
  }

  if (page === 'plan') {
    const slider = document.getElementById('seat-slider');
    if (slider) {
      slider.oninput = e => {
        state.seats = clampInt(e.target.value, 10, 40, 25);
        save();
        document.getElementById('seat-count-label').textContent = state.seats + ' paid seats';
        document.getElementById('mrr-est').textContent = '€' + (state.seats * 19) + ' / mo';
        document.getElementById('pilot-est').textContent = '€' + Math.round(state.seats * 19 * 1.5 + 300);
      };
    }
  }
}

        '<p class="eyebrow">POLINNOVENTURE 2026</p>' +
        '<h2 id="modal-title">About this prototype</h2>' +
        '<p>PractiCore AI is a proposed platform that helps employees apply AI to their everyday work. This interactive demonstration was prepared by Popa Alexandru Daniel and Turcu Nicholas-Leonard.</p>' +
        '<ul>' +
          '<li>Choose a role, map sample tasks and explore a tailored 3-lesson learning path.</li>' +
          '<li>Read practical lessons, write a prompt and receive rule-based checklist feedback.</li>' +
          '<li>Save a sample workflow, download it (.txt) and edit an illustrative impact calculation.</li>' +
          '<li>Explore a fictional aggregate employer dashboard and interactive SME cohort pricing estimator.</li>' +
        '</ul>' +
        '<p>The demo uses predefined role templates, prewritten outputs and local browser storage. It does not call a live AI model, upload data or measure employee performance.</p>' +
        '<p>Use fictional information only. The proposed €19/seat price, €300 onboarding fee, 25-seat base cohort and time estimates are planning assumptions requiring buyer validation.</p>' +
        '<div class="modal-footer">' +
          '<button type="button" class="btn line" id="reset-btn">Reset demo</button>' +
          '<button type="button" class="btn" id="close-modal">Continue exploring</button>' +
        '</div>' +
      '</section>' +
    '</div>';

  document.getElementById('close-modal').onclick = closeModal;
  document.getElementById('reset-btn').onclick = () => {
    state = { ...defaults };
    currentLesson = 0;
    save();
    closeModal();
    nav('work');
    toast('Demo progress reset.');
  };
  document.getElementById('modal-bg').onclick = e => {
    if (e.target.id === 'modal-bg') closeModal();
  };
  document.getElementById('close-modal').focus();
}

function closeModal() {
  const overlay = document.getElementById('overlay');
  if (!overlay || !overlay.innerHTML) return;
  overlay.innerHTML = '';
  const guideBtn = document.getElementById('guide-btn');
  if (guideBtn) guideBtn.focus();
}

document.querySelectorAll('[data-page]').forEach(btn => {
  btn.onclick = () => nav(btn.dataset.page);
});

document.getElementById('brand-btn').onclick = () => nav('work');
document.getElementById('team-btn').onclick = () => nav('team');
document.getElementById('guide-btn').onclick = openModal;

document.getElementById('menu-btn').onclick = () => {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  const isOpen = sb.classList.toggle('open');
  bd.classList.toggle('open', isOpen);
  document.getElementById('menu-btn').setAttribute('aria-expanded', String(isOpen));
};

document.getElementById('sidebar-backdrop').onclick = closeSidebar;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    closeSidebar();
  }
});

render();
</script>
</body>
</html>
